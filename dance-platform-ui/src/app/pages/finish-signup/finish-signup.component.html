<div class="login-page">
  <div class="card login-card">
    <h1 class="page-title">Pick your username</h1>
    <p class="subtitle">
      @if (ticket()?.email) {
        Signed in as {{ ticket()!.email }}
      } @else {
        One last step
      }
    </p>

    @if (error()) {
      <div class="error-message" data-testid="finish-signup-error">{{ error() }}</div>
    }

    @if (ticket()) {
      <form (ngSubmit)="submit()">
        <div class="form-group">
          <label for="finish-username">Username</label>
          <input id="finish-username" data-testid="finish-signup-username" type="text"
                 [(ngModel)]="username" name="username" required minlength="3"
                 autocomplete="username" autofocus />
          <span class="field-hint">This is your public profile address — dance.takelord.com/users/{{ username || '…' }}</span>
        </div>
        <button type="submit" class="btn btn--primary btn--full" data-testid="finish-signup-submit"
                [disabled]="loading()">
          {{ loading() ? 'Creating…' : 'Create account' }}
        </button>
      </form>
    } @else if (!error()) {
      <p class="subtitle">Loading&hellip;</p>
    }
  </div>
</div>
