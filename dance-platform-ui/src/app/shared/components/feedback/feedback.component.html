<!-- Toast stack -->
@if (toast.toasts().length > 0) {
  <div class="toast-stack">
    @for (t of toast.toasts(); track t.id) {
      <div class="toast" [class.toast--error]="t.kind === 'error'" [class.toast--undo]="t.kind === 'undo'" role="status">
        <i class="fa-solid" [class.fa-circle-check]="t.kind === 'success'" [class.fa-triangle-exclamation]="t.kind === 'error'" [class.fa-trash-can]="t.kind === 'undo'" aria-hidden="true"></i>
        <span>{{ t.message }}</span>
        @if (t.kind === 'undo') {
          <button class="toast__undo" (click)="t.undo!()" data-testid="toast-undo">Undo</button>
        }
        <button class="toast__close" (click)="toast.dismiss(t.id)" [attr.aria-label]="t.kind === 'undo' ? 'Dismiss and delete now' : 'Dismiss notification'">
          <i class="fa-solid fa-xmark"></i>
        </button>
        @if (t.kind === 'undo') {
          <!-- Shows the undo window closing, so the button doesn't vanish without warning. -->
          <span class="toast__countdown" [style.animation-duration.ms]="t.durationMs" aria-hidden="true"></span>
        }
      </div>
    }
  </div>
}

<!-- Confirm dialog -->
@if (confirmSvc.pending(); as req) {
  <div class="confirm-backdrop" (click)="confirmSvc.answer(false)">
    <div class="confirm-dialog" role="alertdialog" aria-modal="true" [attr.aria-label]="req.title" (click)="$event.stopPropagation()">
      <h3 class="confirm-dialog__title">{{ req.title }}</h3>
      <p class="confirm-dialog__message">{{ req.message }}</p>
      <div class="confirm-dialog__actions">
        <button #cancelBtn class="btn btn--ghost btn--sm" (click)="confirmSvc.answer(false)">Cancel</button>
        <button class="btn btn--sm" [class.btn--danger]="req.danger" [class.btn--primary]="!req.danger" (click)="confirmSvc.answer(true)">
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
