# Security headers for the SPA vhost (dance.takelord.com), NOT applied automatically.
#
# APPLIED LIVE 2026-09-04: pasted into the Pi's 009-dance-le-ssl.conf (backup at
# /root/009-dance-le-ssl.conf.bak-2026-09-04), verified with curl and the e2e smoke run.
# A rebuild of the Pi, or a Certbot rewrite of that vhost, drops them again — re-paste.
#
# The live vhost lives on the Pi at /etc/apache2/sites-enabled/009-dance-le-ssl.conf and is not
# tracked here (Certbot manages it), so this is a snippet to paste inside its <VirtualHost *:443>
# block, followed by:
#
#     sudo a2enmod headers && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The API sets its own equivalents in code (see SecurityHeaders.cs); these cover the pages Apache
# serves, which that middleware never sees.

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Not DENY: the SPA embeds nothing of its own, but SAMEORIGIN leaves room for the local video
# tools without opening the site to being framed by someone else.
Header always set X-Frame-Options "SAMEORIGIN"

# Only the APIs the players actually need. Camera access is the Camera pane; the rest is denied
# so a third-party player script can't ask for it.
Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()"

# HSTS — READ THIS BEFORE PASTING.
# Browsers remember it for max-age, so it is effectively irreversible for that long: any period
# where the certificate lapses becomes a hard failure rather than a warning. HTTP already
# redirects to HTTPS here (Certbot), so this only closes the first-request gap. Start at a day,
# and only raise it after a month of uneventful renewals. Do not add "preload".
# Header always set Strict-Transport-Security "max-age=86400"

# A Content-Security-Policy is deliberately NOT here. The page loads YouTube, TikTok and
# Instagram players plus their scripts, and a policy written blind would either be so loose it
# says nothing or would break the embeds on deploy. It needs a report-only pass against real
# traffic first.
