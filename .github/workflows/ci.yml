name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: API build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DancePlatform.Tests/DancePlatform.Tests.csproj
      - name: Build
        run: dotnet build DancePlatform.Tests/DancePlatform.Tests.csproj --no-restore -c Release
      - name: Test
        run: dotnet test DancePlatform.Tests/DancePlatform.Tests.csproj --no-build -c Release --verbosity normal

  frontend:
    name: UI build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dance-platform-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dance-platform-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build -- --configuration production

  e2e:
    name: e2e (against the built UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            dance-platform-ui/package-lock.json
            e2e/package-lock.json

      - name: Install UI deps
        working-directory: dance-platform-ui
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      # Fails in a second if a UI change dropped an anchor the suite selects on, so the
      # (slower) browser run below isn't how you find out.
      - name: Verify test-id contract
        working-directory: e2e
        run: npm run verify:testids

      - name: Build UI
        working-directory: dance-platform-ui
        run: npm run build -- --configuration production

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Serves the fresh build locally and proxies /api to the real API, so a PR is tested
      # against its own UI rather than whatever is currently deployed to the Pi.
      # No credentials in CI: the authed project skips itself, anon + api still run.
      - name: Run e2e
        working-directory: e2e
        run: npm run test:local

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
